[package]
name = "tmpc"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
humanize-duration = "0.0.7"
log = "0.4.34"
mpd = "0.1.0"
pretty_env_logger = "0.5.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", optional = true }
sled = "0.34.7"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.25.0", features = ["v7"] }

[features]
default = []
local = ["dep:reqwest"]
